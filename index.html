<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Moved - Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        .countdown {
            font-size: 4rem;
            font-weight: bold;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .redirect-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background-color: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .redirect-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Website Has Moved! 🚀</h1>
        <p>This was our old website hosted on GitHub Pages. We've built a new and improved version!</p>
        
        <div class="countdown" id="countdown">8</div>
        
        <p>You're being automatically redirected to our new site in <span id="seconds-text">8</span> seconds...</p>
        
        <a href="csdudes.com" class="redirect-link" id="redirect-link">
            Click here to go to the new site now →
        </a>
        
        <div class="footer">
            Powered By <span id="new-site-url">CSDudes.com</span>
        </div>
    </div>

    <script>
        // Replace this with your new website URL
        const NEW_WEBSITE_URL = "https://csdudes.com";
        
        // Update the link and display URL
        const redirectLink = document.getElementById('redirect-link');
        const newSiteUrlElement = document.getElementById('new-site-url');
        redirectLink.href = NEW_WEBSITE_URL;
        newSiteUrlElement.textContent = NEW_WEBSITE_URL;
        
        let countdown = 8;
        const countdownElement = document.getElementById('countdown');
        const secondsTextElement = document.getElementById('seconds-text');
        
        // Function to update countdown
        function updateCountdown() {
            countdownElement.textContent = countdown;
            secondsTextElement.textContent = countdown;
            
            if (countdown <= 0) {
                // Redirect when countdown reaches 0
                window.location.href = NEW_WEBSITE_URL;
                return;
            }
            
            countdown--;
            setTimeout(updateCountdown, 1000);
        }
        
        // Start the countdown
        updateCountdown();
    </script>
</body>
</html>
